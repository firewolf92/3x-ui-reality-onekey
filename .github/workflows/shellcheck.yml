name: shell-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n status.sh
          bash -n update.sh
          bash -n uninstall.sh
          bash -n recovery.sh
          bash -n tests/recovery-test.sh
          bash -n tests/panel-auth-test.sh
      - name: ShellCheck
        run: shellcheck install.sh status.sh update.sh uninstall.sh recovery.sh tests/recovery-test.sh tests/panel-auth-test.sh
      - name: Recovery safety tests
        run: bash tests/recovery-test.sh
      - name: 3x-ui CSRF login and inbound integration
        run: bash tests/panel-auth-test.sh
