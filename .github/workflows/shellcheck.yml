name: shell-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n status.sh
          bash -n update.sh
          bash -n uninstall.sh
      - name: ShellCheck
        run: shellcheck install.sh status.sh update.sh uninstall.sh
